<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Pastikan Bootstrap dan Bootstrap Icons sudah terhubung -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .cart-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            min-width: 500px;
            z-index: 1000;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .cart-dropdown.active {
            display: block;
        }

        .btn-delete {
            line-height: 1;
            padding: 2px 6px;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
        <div class="container-fluid">
            <!-- Brand -->
            <a class="navbar-brand" href="#">MyShop</a>

            <!-- Toggle (untuk mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Produk</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Kontak</a>
                    </li>
                </ul>

                <!-- Icon Basket di Navbar -->
                <div class="position-relative" id="basket-container">
                    <i id="basket-icon" class="bi bi-basket fs-4 position-relative" role="button">
                        <span id="cart-badge"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger p-1"
                            style="font-size: 0.65rem;">
                            0
                            <span class="visually-hidden">items in cart</span>
                        </span>
                    </i>

                    <!-- Dropdown -->
                    <div class="cart-dropdown p-3" id="cart-dropdown">
                        <p class="mb-0 text-muted text-center" id="empty-cart">Keranjang Kosong</p>
                        <ul class="list-group list-group-flush" id="cart-list" style="display: none;">

                        </ul>
                        <div id="cart-total" class="mt-3 border-top pt-2 text-end fw-semibold d-none">
                            Total Belanja: <span id="total-amount" class="text-primary">Rp 0</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </nav>
    <section class="container my-5">
        <h2 class="mb-4">Produk Kami</h2>
        <div class="row g-4">
            <!-- Produk 1 -->
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://down-id.img.susercontent.com/file/5d30fd3dc9960e0ec7edb47317f12115"
                        class="card-img-top card-product" alt="Produk A">
                    <div class="card-body">
                        <h5 class="card-title">Produk A</h5>
                        <p class="card-text text-muted">Rp 120.000</p>

                        <div class="input-group mb-3" style="max-width: 160px;">
                            <button class="btn btn-outline-secondary btn-decrement" type="button">−</button>
                            <input type="number" class="form-control text-center product-qty" value="1" min="1" max="10"
                                readonly>
                            <button class="btn btn-outline-secondary btn-increment" type="button">+</button>
                        </div>

                        <button class="btn btn-primary w-100">Tambahkan ke Keranjang</button>
                    </div>
                </div>
            </div>

            <!-- Produk 2 -->
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://images.tokopedia.net/img/cache/700/VqbcmM/2022/4/18/658862bd-3b63-4ab5-8b08-507b8c154062.jpg"
                        class="card-img-top card-product" alt="Produk B">
                    <div class="card-body">
                        <h5 class="card-title">Produk B</h5>
                        <p class="card-text text-muted">Rp 95.000</p>

                        <div class="input-group mb-3" style="max-width: 160px;">
                            <button class="btn btn-outline-secondary btn-decrement" type="button">−</button>
                            <input type="number" class="form-control text-center product-qty" value="1" min="1"
                                max="10">
                            <button class="btn btn-outline-secondary btn-increment" type="button">+</button>
                        </div>

                        <button class="btn btn-primary w-100">Tambahkan ke Keranjang</button>
                    </div>
                </div>
            </div>

            <!-- Produk 3 -->
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://www.mainbasket.com/uploads/post/2018/01/08/nike-air-force-1-modern-classic.jpg"
                        class="card-img-top card-product" alt="Produk C">
                    <div class="card-body">
                        <h5 class="card-title">Produk C</h5>
                        <p class="card-text text-muted">Rp 150.000</p>

                        <div class="input-group mb-3" style="max-width: 160px;">
                            <button class="btn btn-outline-secondary btn-decrement" type="button">−</button>
                            <input type="number" class="form-control text-center product-qty" value="1" min="1"
                                max="10">
                            <button class="btn btn-outline-secondary btn-increment" type="button">+</button>
                        </div>

                        <button class="btn btn-primary w-100">Tambahkan ke Keranjang</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Toast Container -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
        <div id="cart-toast" class="toast align-items-center text-bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Produk berhasil ditambahkan ke keranjang!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.btn-increment').forEach(btn => {
            btn.addEventListener('click', function () {
                const input = this.parentElement.querySelector('.product-qty');
                let value = parseInt(input.value);
                const max = parseInt(input.max);
                if (value < max) {
                    input.value = value + 1;
                }
            });
        });

        document.querySelectorAll('.btn-decrement').forEach(btn => {
            btn.addEventListener('click', function () {
                const input = this.parentElement.querySelector('.product-qty');
                let value = parseInt(input.value);
                const min = parseInt(input.min);
                if (value > min) {
                    input.value = value - 1;
                }
            });
        });
    </script>
    <script>
        const cart = [];

        const cartBadge = document.getElementById('cart-badge');
        const cartList = document.getElementById('cart-list');
        const emptyCartText = document.getElementById('empty-cart');


        // Tambahkan event ke semua tombol "Tambahkan ke Keranjang"
        document.querySelectorAll('.btn-primary').forEach((btn, index) => {
            btn.addEventListener('click', function () {
                const card = this.closest('.card');
                const imgElement = card.querySelector('.card-product'); // Cari tag <img> di dalam .card-image
                const urlImage = imgElement.src; // Ambil nilai atribut 'src' dari tag <img> tersebut
                const productName = card.querySelector('.card-title').innerText;
                const qtyInput = card.querySelector('.product-qty');
                const quantity = parseInt(qtyInput.value);
                const priceText = card.querySelector('.card-text').innerText;
                const price = parseInt(priceText.replace(/[^\d]/g, '')); // Ambil angka dari "Rp 120.000"


                // Cek apakah produk sudah ada di keranjang
                const existing = cart.find(item => item.name === productName);
                if (existing) {
                    existing.quantity += quantity;
                } else {
                    cart.push({ name: productName, urlImage, quantity, price });
                }


                updateCartUI();
                showAddToCartToast(); // ✅ Tampilkan notifikasi
                qtyInput.value = 1;
            });
        });

        function updateCartUI() {
            let totalHarga = 0;

            // Update badge total item
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartBadge.innerText = totalItems;

            // Update isi keranjang
            if (cart.length === 0) {
                emptyCartText.style.display = 'block';
                cartList.style.display = 'none';
            } else {
                emptyCartText.style.display = 'none';
                cartList.style.display = 'block';
                cartList.innerHTML = '';

                cart.forEach((item, index) => {
                    const subtotal = item.quantity * item.price;
                    totalHarga += subtotal;

                    const li = document.createElement('li');
                    li.className = 'list-group-item';

                    li.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                <div class="col-4">
                    <img src="${item.urlImage}" class="img-fluid" />
                </div>
                <div class="col-6 d-flex flex-column">
                    <span>${item.name}</span>
                    <small>${item.quantity} × Rp ${formatRupiah(item.price)} = Rp ${formatRupiah(subtotal)}</small>
                </div>
                <div class="col-2 text-end">
                    <button class="btn btn-sm btn-outline-danger btn-delete" data-index="${index}">&times;</button>
                </div>
                </div>
            `;

                    cartList.appendChild(li);
                });

                // Pasang event listener tombol hapus
                const deleteButtons = cartList.querySelectorAll('.btn-delete');
                deleteButtons.forEach(btn => {
                    btn.addEventListener('click', function () {
                        const index = parseInt(this.dataset.index);
                        cart.splice(index, 1);
                        updateCartUI(); // Refresh UI
                    });
                });
            }

            // Update total belanja
            const cartTotal = document.getElementById('cart-total');
            const totalAmount = document.getElementById('total-amount');

            if (cart.length === 0) {
                cartTotal.classList.add('d-none');
            } else {
                cartTotal.classList.remove('d-none');
                totalAmount.innerText = `Rp ${formatRupiah(totalHarga)}`;
            }
        }

        // Inisialisasi Toast
        const toastElement = document.getElementById('cart-toast');
        const toast = new bootstrap.Toast(toastElement);

        // Tampilkan toast
        function showAddToCartToast() {
            toast.show();
        }

        // Toggle buka/tutup dropdown saat ikon diklik
        const basketIcon = document.getElementById('basket-icon');
        const cartDropdown = document.getElementById('cart-dropdown');

        basketIcon.addEventListener('click', () => {
            cartDropdown.classList.toggle('active');
        });

        // Tutup dropdown kalau klik di luar
        document.addEventListener('click', (e) => {
            if (!document.getElementById('basket-container').contains(e.target)) {
                cartDropdown.classList.remove('active');
            }
        });
        function formatRupiah(angka) {
            return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

    </script>

</body>

</html>
