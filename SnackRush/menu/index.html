<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Rush</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kavoon&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../dist/custom.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <!-- Navbar SnackRush -->
    <nav class="navbar navbar-expand-lg shadow-sm sticky-top bg-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <img src="../assets/icon-navbar.png" alt="SnackRush" style="height: 60px; width: 60px;"
                    class="d-none d-md-inline">SnackRush<span class="text-danger "> >></span>
            </a>
            <div class="position-relative order-lg-2 ms-auto me-auto" id="basket-container">
                <i id="basket-icon" class="bi bi-basket fs-4 position-relative" role="button">
                    <span id="cart-badge"
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger p-1"
                        style="font-size: 0.65rem; font-weight: 800 ;">
                        0
                        <span class="visually-hidden">items in cart</span>
                    </span>
                </i>

                <!-- Dropdown -->
                <div class="cart-dropdown p-3" id="cart-dropdown">
                    <p class="mb-0 text-muted text-center" id="empty-cart">Keranjang Kosong</p>
                    <ul class="list-group list-group-flush" id="cart-list" style="display: none;">

                    </ul>

                    <div id="cart-total"
                        class="mt-3 border-top pt-2 text-end fw-semibold d-none justify-content-between d-flex align-items-center">
                        <div class="btn btn-primary">
                            Go To Cart <i class="bi bi-cart"></i>
                        </div>
                        <p class="mb-0">
                            Total Belanja : <span id="total-amount" class="text-primary">Rp 0</span></p>
                    </div>
                </div>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-4 order-lg-1">
                    <li class="nav-item">
                        <a class="nav-link active" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#menu">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#promo">Promo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#outlet">Outlet</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Kontak</a>
                    </li>
                </ul>
            </div>
    </nav>
    <section class="py-5" id="menuSection">
        <div class="container">
            <div class="row">

                <!-- Sidebar Kategori -->
                <div class="col-md-3 mb-4">
                    <!-- Form Pencarian -->
                    <form class="mb-3" id="searchForm">
                        <input type="search" id="searchInput" class="form-control" name="q"
                            placeholder="Cari makanan...">
                    </form>
                    <div class="list-group">
                        <a href="#" class="list-group-item list-group-item-action active-categories"
                            data-category="Semua">Semua</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="Promo">Promo</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="Paket Hemat">Paket
                            Hemat</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="Paket Komplit">Paket
                            Komplit</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="Paket Keluarga">Paket
                            Keluarga</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="Ala Carte">A'la
                            Carte</a>
                    </div>
                </div>
                <!-- MainContent Menu -->
                <div class="col-md-9">
                    <div class="row g-4" id="main-content-menu">

                    </div>

                </div>
            </div>
        </div>
    </section>
    <!-- Toast Container -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
        <div id="cart-toast" class="toast align-items-center text-bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Produk berhasil ditambahkan ke keranjang!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>
    <script src="../dist/js/bootstrap.bundle.min.js"></script>
    <script src="../main.js"></script>


</body>

</html>
