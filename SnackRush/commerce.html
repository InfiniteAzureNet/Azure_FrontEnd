<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produk + localStorage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>


    <div class="container my-4">
        <div class="row">
            <!-- Kiri -->
            <div class="col-md-6 mb-4">
                <h4>Daftar Produk</h4>

                <div class="card mb-3" data-nama="Produk A" data-harga="100000">
                    <div class="card-body">
                        <h5 class="card-title">Produk A</h5>
                        <p class="card-text">Rp 100.000</p>
                        <div class="input-group mb-2" style="max-width: 140px;">
                            <button class="btn btn-outline-secondary btn-kurang"><i class="bi bi-dash"></i></button>
                            <input type="text" class="form-control text-center input-qty" value="1" readonly>
                            <button class="btn btn-outline-secondary btn-tambah-qty"><i class="bi bi-plus"></i></button>
                        </div>
                        <button class="btn btn-primary btn-tambahkan">Tambahkan</button>
                    </div>
                </div>

                <div class="card mb-3" data-nama="Produk B" data-harga="150000">
                    <div class="card-body">
                        <h5 class="card-title">Produk B</h5>
                        <p class="card-text">Rp 150.000</p>
                        <div class="input-group mb-2" style="max-width: 140px;">
                            <button class="btn btn-outline-secondary btn-kurang"><i class="bi bi-dash"></i></button>
                            <input type="text" class="form-control text-center input-qty" value="1" readonly>
                            <button class="btn btn-outline-secondary btn-tambah-qty"><i class="bi bi-plus"></i></button>
                        </div>
                        <button class="btn btn-primary btn-tambahkan">Tambahkan</button>
                    </div>
                </div>

                <div class="card mb-3" data-nama="Produk C" data-harga="200000">
                    <div class="card-body">
                        <h5 class="card-title">Produk C</h5>
                        <p class="card-text">Rp 200.000</p>
                        <div class="input-group mb-2" style="max-width: 140px;">
                            <button class="btn btn-outline-secondary btn-kurang"><i class="bi bi-dash"></i></button>
                            <input type="text" class="form-control text-center input-qty" value="1" readonly>
                            <button class="btn btn-outline-secondary btn-tambah-qty"><i class="bi bi-plus"></i></button>
                        </div>
                        <button class="btn btn-primary btn-tambahkan">Tambahkan</button>
                    </div>
                </div>
            </div>

            <!-- Kanan -->
            <div class="col-md-6 mb-4">
                <h4>Produk Ditambahkan</h4>
                <ul class="list-group mb-3" id="daftar-tambahan">
                    <li class="list-group-item text-muted">Belum ada produk ditambahkan.</li>
                </ul>
                <div class="alert alert-info">
                    <strong>Total Belanja: </strong> <span id="total-belanja">Rp 0</span>
                </div>
            </div>
        </div>
    </div>
    <!-- Tombol toggle keranjang -->
    <button id="btnToggleDaftar" class="btn btn-outline-primary position-relative mb-3">
        <i class="bi bi-basket"></i><span id="cartBadge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            0
        </span>
    </button>

    <!-- Daftar produk ditambahkan -->
    <ul id="daftar-tambahan" class="list-group" style="display: none;"></ul>


    <script>
        const daftarTambahan = document.getElementById('daftar-tambahan');
        const totalBelanjaEl = document.getElementById('total-belanja');
        const itemMap = new Map();

        function simpanKeLocalStorage() {
            const obj = {};
            itemMap.forEach((val, key) => {
                obj[key] = { qty: val.quantity, harga: val.harga };
            });
            localStorage.setItem('keranjang', JSON.stringify(obj));
        }

        function loadDariLocalStorage() {
            const data = JSON.parse(localStorage.getItem('keranjang'));
            if (data) {
                for (const nama in data) {
                    const { qty, harga } = data[nama];
                    tambahkanKeDaftar(nama, harga, qty, false);
                }
            }
        }

        document.querySelectorAll('.card').forEach(card => {
            const qtyInput = card.querySelector('.input-qty');
            const btnTambah = card.querySelector('.btn-tambah-qty');
            const btnKurang = card.querySelector('.btn-kurang');
            const btnTambahkan = card.querySelector('.btn-tambahkan');

            btnTambah.addEventListener('click', () => {
                qtyInput.value = parseInt(qtyInput.value) + 1;
            });

            btnKurang.addEventListener('click', () => {
                const current = parseInt(qtyInput.value);
                if (current > 1) qtyInput.value = current - 1;
            });

            btnTambahkan.addEventListener('click', () => {
                const nama = card.dataset.nama;
                const harga = parseInt(card.dataset.harga);
                const qty = parseInt(qtyInput.value);
                tambahkanKeDaftar(nama, harga, qty, true);
                qtyInput.value = 1;
            });
        });

        function tambahkanKeDaftar(nama, harga, qty, simpan = true) {
            const placeholder = daftarTambahan.querySelector('.text-muted');
            if (placeholder) placeholder.remove();

            if (itemMap.has(nama)) {
                const data = itemMap.get(nama);
                data.quantity += qty;
                updateItemUI(data);
            } else {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'me-auto';
                infoDiv.innerHTML = `
          <strong>${nama}</strong><br>
          <span class="item-detail"></span>
        `;

                const btnHapus = document.createElement('button');
                btnHapus.className = 'btn btn-sm btn-danger';
                btnHapus.innerHTML = '<i class="bi bi-trash"></i>';

                li.appendChild(infoDiv);
                li.appendChild(btnHapus);
                daftarTambahan.appendChild(li);

                const data = {
                    quantity: qty,
                    harga: harga,
                    element: li,
                    detailEl: infoDiv.querySelector('.item-detail')
                };

                itemMap.set(nama, data);
                updateItemUI(data);

                btnHapus.addEventListener('click', () => {
                    li.remove();
                    itemMap.delete(nama);
                    updateTotalBelanja();
                    updateCartBadge();
                    simpanKeLocalStorage();
                    if (itemMap.size === 0) tampilkanKosong();
                });
            }

            updateTotalBelanja();
            if (simpan) simpanKeLocalStorage();
        }
        function updateCartBadge() {
            cartBadge.textContent = itemMap.size;
        }

        function updateItemUI(data) {
            const total = data.quantity * data.harga;
            data.detailEl.innerHTML = `${data.quantity} × Rp ${data.harga.toLocaleString()} = <strong>Rp ${total.toLocaleString()}</strong>`;
        }

        function updateTotalBelanja() {
            let total = 0;
            itemMap.forEach(item => {
                total += item.quantity * item.harga;
            });
            totalBelanjaEl.textContent = `Rp ${total.toLocaleString()}`;
        }

        function tampilkanKosong() {
            const kosong = document.createElement('li');
            kosong.className = 'list-group-item text-muted';
            kosong.textContent = 'Belum ada produk ditambahkan.';
            daftarTambahan.appendChild(kosong);
        }

        // Saat pertama kali halaman dibuka
        loadDariLocalStorage();
    </script>
    <script>
        const btnToggleDaftar = document.getElementById('btnToggleDaftar');

        btnToggleDaftar.addEventListener('click', () => {
            daftarTambahan.style.display = daftarTambahan.style.display === 'none' ? 'block' : 'none';
        });

    </script>
</body>

</html>
