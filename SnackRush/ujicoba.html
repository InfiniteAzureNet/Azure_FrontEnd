<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dynamic Cart with Remove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

    </style>
    <style>
        .cart-icon {
            position: relative;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7rem;
        }

        .cart-remove-btn {
            border: none;
            background: transparent;
            color: red;
            font-size: 0.8rem;
            margin-left: 6px;
            cursor: pointer;
        }

        @keyframes cart-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }

            60% {
                transform: translateY(3px);
            }
        }

        .cart-animate {
            animation: cart-bounce 0.4s ease;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">MyShop</a>

            <div class="d-flex align-items-center ms-auto">
                <!-- Cart Icon with Popover -->
                <div id="cartIcon" class="ms-3 cart-icon" tabindex="0">
                    🛒
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <div class="row g-4" id="productList">
            <!-- Card akan digenerate otomatis oleh JavaScript -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ✅ TOAST CONTAINER -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
        <div id="addToCartToast" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    ✅ Produk berhasil ditambahkan ke keranjang!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- ✅ SCRIPT SECTION -->
    <script>
        // Inisialisasi toast setelah DOM ready
        const toastEl = document.getElementById('addToCartToast');
        const toast = new bootstrap.Toast(toastEl, {
            delay: 2000
        });

        // Sekarang toast.show() bisa dipanggil di mana saja
    </script>
    <script>
        // Dummy data keranjang
        let cartItems = []; // keranjang kosong di awal
        // Format angka ke Rupiah
        function toRupiah(num) {
            return 'Rp ' + num.toLocaleString('id-ID');
        }
        // Fungsi render isi cart
        function generateCartHTML(items) {
            if (items.length === 0) {
                return `<p class="text-muted m-0">Keranjang kosong.</p>`;
            }

            return items.map(item => `
                <div class="d-flex justify-content-between align-items-center mb-2" >
                <div>
                    <strong>${item.name}</strong><br>
                    <small>${item.quantity} × ${toRupiah(item.price)}</small>
                </div>
                <div>
                    <span class="text-end fw-semibold">${toRupiah(item.price * item.quantity)}</span><br>
                    <button class="btn btn-sm btn-danger mt-1" onclick="removeFromCart(${item.id})">🗑️</button>
                </div>
                </div>
            `).join('');

        }

        function updateCartBadge() {
            const badge = document.getElementById("cart-count");
            const totalQty = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            badge.textContent = totalQty;
            badge.style.display = totalQty > 0 ? "inline-block" : "none";
        }
    </script>
    <script>
        // Data produk dummy
        const products = [
            {
                id: 1,
                name: "Produk A",
                description: "Deskripsi singkat produk A",
                price: 99000,
                image: "https://via.placeholder.com/300x200?text=Produk+A"
            },
            {
                id: 2,
                name: "Produk B",
                description: "Deskripsi singkat produk B",
                price: 129000,
                image: "https://via.placeholder.com/300x200?text=Produk+B"
            },
            {
                id: 3,
                name: "Produk C",
                description: "Deskripsi singkat produk C",
                price: 159000,
                image: "https://via.placeholder.com/300x200?text=Produk+C"
            },
        ];
        function increaseQty(id) {
            const input = document.getElementById(`qty-${id}`);
            input.value = parseInt(input.value) + 1;
        }

        function decreaseQty(id) {
            const input = document.getElementById(`qty-${id}`);
            if (parseInt(input.value) > 1) {
                input.value = parseInt(input.value) - 1;
            }
        }

        // Render card produk ke halaman
        function renderProducts() {
            const productList = document.getElementById("productList");
            productList.innerHTML = "";

            products.forEach(product => {
                const col = document.createElement("div");
                col.className = "col-md-4";

                col.innerHTML = `
      <div class="card h-100 shadow-sm">
        <img src="${product.image}" class="card-img-top" alt="${product.name}" style="object-fit: cover; height: 200px;">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">${product.name}</h5>
          <p class="card-text text-muted">${product.description}</p>
          <p class="fw-bold text-primary">${toRupiah(product.price)}</p>

          <!-- Quantity Input Group -->
          <div class="input-group mb-3" style="max-width: 140px;">
            <button class="btn btn-outline-secondary" type="button" onclick="decreaseQty(${product.id})">−</button>
            <input type="number" class="form-control text-center" id="qty-${product.id}" value="1" min="1" readonly>
            <button class="btn btn-outline-secondary" type="button" onclick="increaseQty(${product.id})">+</button>
          </div>

          <button class="btn btn-outline-primary mt-auto" onclick="addToCart(${product.id})">➕ Tambah ke Keranjang</button>
        </div>
      </div>
    `;

                productList.appendChild(col);
            });
        }


        // Tambah produk ke cart
        function addToCart(productId) {
            const qtyInput = document.getElementById(`qty-${productId}`);
            const quantity = parseInt(qtyInput.value);
            const product = products.find(p => p.id === productId);
            const existing = cartItems.find(item => item.id === productId);

            if (existing) {
                existing.quantity += quantity;
            } else {
                cartItems.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: quantity
                });
            }

            qtyInput.value = 1;
            updateCartBadge();
            // Inisialisasi
            const cartIcon = document.getElementById('cartIcon');
            const popover = new bootstrap.Popover(cartIcon, {
                title: "Keranjang",
                content: generateCartHTML(cartItems),
                html: true,
                trigger: "click",
                placement: "bottom"
            });

            // Re-render popover saat icon diklik
            cartIcon.addEventListener("click", () => {
                popover.setContent({ content: generateCartHTML(cartItems) });
            });

            // 🛒 Icon animasi
            cartIcon.classList.add("cart-animate");
            setTimeout(() => {
                cartIcon.classList.remove("cart-animate");
            }, 400);
            console.log("Cart Items:", cartItems);
            console.log("Popover Exists?", !!popover);

            // ✅ Toast notifikasi
            toast.show();
        }
        // Jalankan render saat halaman siap
        function removeFromCart(id) {
            cartItems = cartItems.filter(item => item.id !== id);
            updateCartBadge();
            popover.setContent({ content: generateCartHTML(cartItems) });
        }
        renderProducts();
    </script>

</body>

</html>
